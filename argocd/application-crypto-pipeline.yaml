apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-pipeline
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/YOUR_USERNAME/crypto-pipeline.git  # UPDATE THIS
    targetRevision: main
    path: k8s
  
  destination:
    server: https://kubernetes.default.svc
    namespace: crypto-pipeline
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health assessment
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  
  # Notifications
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-pipeline-helm
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/YOUR_USERNAME/crypto-pipeline.git  # UPDATE THIS
    targetRevision: main
    path: helm
    helm:
      valueFiles:
      - values.yaml
      parameters:
      - name: global.registry
        value: YOUR_ECR_REGISTRY  # UPDATE THIS
      - name: global.imageTag
        value: latest
  
  destination:
    server: https://kubernetes.default.svc
    namespace: crypto-pipeline
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
