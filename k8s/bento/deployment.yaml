apiVersion: apps/v1
kind: Deployment
metadata:
  name: bento-price-predictor
  namespace: app
  labels:
    app: bento-price-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bento-price-predictor
  template:
    metadata:
      labels:
        app: bento-price-predictor
    spec:
      containers:
        - name: bento-price-predictor
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MLOPS_MODEL_PATH
              value: /models/coinbase_ml_model.joblib
            - name: MLOPS_MODEL_URI
              value: ""
            - name: MLOPS_HORIZON
              value: "4"
            - name: MLOPS_FREQ_MINUTES
              value: "60"
          volumeMounts:
            - name: model-artifact
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: model-artifact
          configMap:
            name: bento-model-artifact
