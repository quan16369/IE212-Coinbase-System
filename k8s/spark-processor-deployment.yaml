apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: crypto-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: crypto-pipeline
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: crypto-pipeline
subjects:
- kind: ServiceAccount
  name: spark
  namespace: crypto-pipeline
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-processor
  namespace: crypto-pipeline
  labels:
    app: spark-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-processor
  template:
    metadata:
      labels:
        app: spark-processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4040"
    spec:
      serviceAccountName: spark
      containers:
      - name: spark-processor
        image: ${DOCKER_REGISTRY}/spark-processor:${VERSION}
        imagePullPolicy: Always
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"
        - name: CASSANDRA_HOST
          value: "cassandra-0.cassandra.crypto-pipeline.svc.cluster.local"
        - name: CASSANDRA_PORT
          value: "9042"
        - name: SPARK_MASTER
          value: "k8s://https://kubernetes.default.svc:443"
        - name: SPARK_EXECUTOR_INSTANCES
          value: "3"
        - name: SPARK_EXECUTOR_MEMORY
          value: "2g"
        - name: SPARK_EXECUTOR_CORES
          value: "2"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
            ephemeral-storage: "5Gi"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            ephemeral-storage: "10Gi"
        ports:
        - containerPort: 4040
          name: spark-ui
---
apiVersion: v1
kind: Service
metadata:
  name: spark-processor
  namespace: crypto-pipeline
  labels:
    app: spark-processor
spec:
  selector:
    app: spark-processor
  ports:
  - port: 4040
    targetPort: 4040
    name: spark-ui
