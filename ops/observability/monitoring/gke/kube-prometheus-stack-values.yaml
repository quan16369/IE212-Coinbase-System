grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: false
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.tracing.svc.cluster.local:3200
      isDefault: false

prometheus:
  prometheusSpec:
    retention: 2h
    storageSpec: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

additionalPrometheusRulesMap:
  bento-price-predictor:
    groups:
      - name: bento-price-predictor
        rules:
          - alert: BentoPredictorUnavailable
            expr: kube_deployment_status_replicas_available{namespace="app", deployment="bento-price-predictor"} < 1
            for: 2m
            labels:
              severity: critical
              service: bento-price-predictor
            annotations:
              summary: "BentoML predictor has no available replicas"
              description: "Deployment app/bento-price-predictor has had no available replicas for more than 2 minutes."

          - alert: BentoPredictorRestarting
            expr: sum(increase(kube_pod_container_status_restarts_total{namespace="app", container="bento-price-predictor"}[10m])) > 0
            for: 1m
            labels:
              severity: warning
              service: bento-price-predictor
            annotations:
              summary: "BentoML predictor pod restarted"
              description: "One or more BentoML predictor containers restarted during the last 10 minutes."

          - alert: BentoPredictorProblemPods
            expr: sum(kube_pod_status_phase{namespace="app", phase=~"Failed|Unknown|Pending"}) > 0
            for: 5m
            labels:
              severity: warning
              service: bento-price-predictor
            annotations:
              summary: "BentoML predictor namespace has problem pods"
              description: "There are pods in Failed, Unknown, or Pending phase in namespace app for more than 5 minutes."

  data-validation:
    groups:
      - name: data-validation
        rules:
          - alert: DataValidationUnavailable
            expr: kube_deployment_status_replicas_available{namespace="data-ingestion", deployment="data-validation"} < 1
            for: 2m
            labels:
              severity: critical
              service: data-validation
            annotations:
              summary: "Data validation service has no available replicas"
              description: "Deployment data-ingestion/data-validation has had no available replicas for more than 2 minutes."

          - alert: DataValidationRestarting
            expr: sum(increase(kube_pod_container_status_restarts_total{namespace="data-ingestion", container="data-validation"}[10m])) > 0
            for: 1m
            labels:
              severity: warning
              service: data-validation
            annotations:
              summary: "Data validation pod restarted"
              description: "One or more data-validation containers restarted during the last 10 minutes."

          - alert: DataValidationProblemPods
            expr: sum(kube_pod_status_phase{namespace="data-ingestion", phase=~"Failed|Unknown|Pending"}) > 0
            for: 5m
            labels:
              severity: warning
              service: data-validation
            annotations:
              summary: "Data ingestion namespace has problem pods"
              description: "There are pods in Failed, Unknown, or Pending phase in namespace data-ingestion for more than 5 minutes."

          - alert: DataValidationTelemetryProducerFailed
            expr: sum(increase(kube_job_status_failed{namespace="data-ingestion", job_name=~"data-validation-telemetry-producer.*"}[30m])) > 0
            for: 1m
            labels:
              severity: warning
              service: data-validation
            annotations:
              summary: "Data validation telemetry producer job failed"
              description: "A telemetry producer job failed in namespace data-ingestion during the last 30 minutes."

  feature-platform:
    groups:
      - name: feature-platform
        rules:
          - alert: FeaturePlatformUnavailable
            expr: kube_deployment_status_replicas_available{namespace="feature-platform", deployment="feature-platform"} < 1
            for: 2m
            labels:
              severity: critical
              service: feature-platform
            annotations:
              summary: "Feature platform service has no available replicas"
              description: "Deployment feature-platform/feature-platform has had no available replicas for more than 2 minutes."

          - alert: FeaturePlatformRestarting
            expr: sum(increase(kube_pod_container_status_restarts_total{namespace="feature-platform", container="feature-platform"}[10m])) > 0
            for: 1m
            labels:
              severity: warning
              service: feature-platform
            annotations:
              summary: "Feature platform pod restarted"
              description: "One or more feature-platform containers restarted during the last 10 minutes."

          - alert: FeaturePlatformProblemPods
            expr: sum(kube_pod_status_phase{namespace="feature-platform", phase=~"Failed|Unknown|Pending"}) > 0
            for: 5m
            labels:
              severity: warning
              service: feature-platform
            annotations:
              summary: "Feature platform namespace has problem pods"
              description: "There are pods in Failed, Unknown, or Pending phase in namespace feature-platform for more than 5 minutes."

  inference-orchestrator:
    groups:
      - name: inference-orchestrator
        rules:
          - alert: InferenceOrchestratorUnavailable
            expr: kube_deployment_status_replicas_available{namespace="model-serving", deployment="inference-orchestrator"} < 1
            for: 2m
            labels:
              severity: critical
              service: inference-orchestrator
            annotations:
              summary: "Inference orchestrator has no available replicas"
              description: "Deployment model-serving/inference-orchestrator has had no available replicas for more than 2 minutes."

          - alert: InferenceOrchestratorRestarting
            expr: sum(increase(kube_pod_container_status_restarts_total{namespace="model-serving", container="inference-orchestrator"}[10m])) > 0
            for: 1m
            labels:
              severity: warning
              service: inference-orchestrator
            annotations:
              summary: "Inference orchestrator pod restarted"
              description: "One or more inference-orchestrator containers restarted during the last 10 minutes."

          - alert: InferenceOrchestratorProblemPods
            expr: sum(kube_pod_status_phase{namespace="model-serving", phase=~"Failed|Unknown|Pending"}) > 0
            for: 5m
            labels:
              severity: warning
              service: inference-orchestrator
            annotations:
              summary: "Model-serving namespace has problem pods"
              description: "There are pods in Failed, Unknown, or Pending phase in namespace model-serving for more than 5 minutes."

  streaming-platform:
    groups:
      - name: streaming-platform
        rules:
          - alert: KafkaUnavailable
            expr: kube_statefulset_status_replicas_ready{namespace="data-streaming", statefulset="streaming-platform-kafka"} < 1
            for: 2m
            labels:
              severity: critical
              service: kafka
            annotations:
              summary: "Kafka has no ready replicas"
              description: "The data-streaming Kafka StatefulSet has had no ready replicas for more than 2 minutes."

          - alert: CoinbaseProducerUnavailable
            expr: kube_deployment_status_replicas_available{namespace="data-streaming", deployment="streaming-platform-producer"} < 1
            for: 2m
            labels:
              severity: critical
              service: coinbase-producer
            annotations:
              summary: "Coinbase telemetry producer is unavailable"
              description: "The Coinbase producer has had no available replicas for more than 2 minutes."

          - alert: RawDataSinkUnavailable
            expr: kube_deployment_status_replicas_available{namespace="data-streaming", deployment="streaming-platform-raw-data-sink"} < 1
            for: 5m
            labels:
              severity: warning
              service: raw-data-sink
            annotations:
              summary: "Raw GCS sink is unavailable"
              description: "The raw-data sink has had no available replicas for more than 5 minutes."

  model-training:
    groups:
      - name: model-training
        rules:
          - alert: MLflowUnavailable
            expr: kube_statefulset_status_replicas_ready{namespace="model-training", statefulset="mlflow"} < 1
            for: 2m
            labels:
              severity: critical
              service: mlflow
            annotations:
              summary: "MLflow is unavailable"
              description: "The MLflow StatefulSet has had no ready replicas for more than 2 minutes."

          - alert: ModelTrainingJobFailed
            expr: sum(increase(kube_job_status_failed{namespace="model-training", job_name=~"coinbase-model-training.*"}[24h])) > 0
            for: 1m
            labels:
              severity: warning
              service: model-training
            annotations:
              summary: "Model training job failed"
              description: "At least one model training job failed during the last 24 hours."

          - alert: ModelValidationJobFailed
            expr: sum(increase(kube_job_status_failed{namespace="model-training", job_name=~"coinbase-model-validation.*"}[24h])) > 0
            for: 1m
            labels:
              severity: warning
              service: model-validation
            annotations:
              summary: "Model validation gate failed"
              description: "At least one model validation job failed during the last 24 hours."

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "noop"
      group_by:
        - namespace
        - service
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "noop"
      - name: "null"
    templates: []
  alertmanagerSpec:
    replicas: 1
    retention: 2h
    storage: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

defaultRules:
  create: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false

kubeApiServer:
  enabled: false

kubelet:
  enabled: false

kubeControllerManager:
  enabled: false

coreDns:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheusOperator:
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
    certManager:
      enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
