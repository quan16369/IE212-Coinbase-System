replicaCount: 1
namespace: app

image:
  repository: asia-southeast1-docker.pkg.dev/PROJECT_ID/coinbase-mlops/coinbase-bento-price-predictor
  tag: dev
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /

model:
  fileName: coinbase_ml_model.joblib
  uri: ""
  mlflowTrackingUri: http://mlflow.model-training.svc.cluster.local:5000

tracing:
  enabled: false
  serviceName: bento-price-predictor
  otlpEndpoint: http://otel-collector.tracing.svc.cluster.local:4317
  sampler: always_on
  resourceAttributes: deployment.environment=gke,service.namespace=app

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext: {}

containerSecurityContext: {}

networkPolicy:
  enabled: false
  allowedNamespaces:
    - app
    - ingress-nginx
    - monitoring

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

syntheticProbe:
  enabled: false
  schedule: "*/5 * * * *"
  image: curlimages/curl:8.11.1
  runAsUser: 100
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
