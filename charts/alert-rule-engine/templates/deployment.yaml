apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alert-rule-engine.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "alert-rule-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alert-rule-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alert-rule-engine.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ include "alert-rule-engine.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ALERT_RETURN_THRESHOLD
              value: {{ .Values.rules.returnThreshold | quote }}
            - name: ALERT_HISTORY_LIMIT
              value: {{ .Values.rules.historyLimit | quote }}
            - name: ALERT_INDEX_URL
              value: {{ .Values.alertIndex.url | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
