namespace: alert-routing

replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/PROJECT_ID/coinbase-mlops/coinbase-alert-rule-engine
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

rules:
  returnThreshold: "0.005"
  historyLimit: "200"

alertIndex:
  url: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1
