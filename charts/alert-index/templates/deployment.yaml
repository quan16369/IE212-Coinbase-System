apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alert-index.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "alert-index.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alert-index.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alert-index.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ include "alert-index.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ALERT_INDEX_PATH
              value: {{ .Values.index.path | quote }}
            - name: ALERT_INDEX_MAX_RESULTS
              value: {{ .Values.index.maxResults | quote }}
          volumeMounts:
            - name: alert-index-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: alert-index-data
          emptyDir: {}
