namespace: model-serving

replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/PROJECT_ID/coinbase-mlops/coinbase-inference-orchestrator
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

monitoring:
  enabled: true
  release: kube-prometheus-stack
  interval: 15s

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  tls:
    enabled: false
    secretName: ""

bento:
  predictUrl: http://bento-price-predictor.app.svc.cluster.local/predict

featurePlatform:
  url: http://feature-platform.feature-platform.svc.cluster.local

alerts:
  returnThreshold: "0.005"
  historyLimit: "200"
  indexPath: /data/alerts.jsonl
  # JSONL persistence is intentionally single-writer. Use PostgreSQL before
  # enabling multiple orchestrator replicas.
  persistence:
    enabled: true
    size: 1Gi

governance:
  historyLimit: "1000"
  indexPath: /data/governance_decisions.jsonl
  outcomeDbPath: /data/outcomes.db
  observabilityPostgresDsn: postgresql://feature_user:feature_password@feature-platform-postgres.feature-platform.svc.cluster.local:5432/feature_store

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1
