apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-orchestrator.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "inference-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inference-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inference-orchestrator.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ include "inference-orchestrator.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BENTO_PREDICT_URL
              value: {{ .Values.bento.predictUrl | quote }}
            - name: FEATURE_PLATFORM_URL
              value: {{ .Values.featurePlatform.url | quote }}
            - name: ALERT_RETURN_THRESHOLD
              value: {{ .Values.alerts.returnThreshold | quote }}
            - name: ALERT_HISTORY_LIMIT
              value: {{ .Values.alerts.historyLimit | quote }}
            - name: ALERT_INDEX_PATH
              value: {{ .Values.alerts.indexPath | quote }}
            - name: GOVERNANCE_HISTORY_LIMIT
              value: {{ .Values.governance.historyLimit | quote }}
            - name: GOVERNANCE_INDEX_PATH
              value: {{ .Values.governance.indexPath | quote }}
            - name: OUTCOME_DB_PATH
              value: {{ .Values.governance.outcomeDbPath | quote }}
            - name: OBSERVABILITY_POSTGRES_DSN
              value: {{ .Values.governance.observabilityPostgresDsn | quote }}
          volumeMounts:
            - name: alert-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: alert-data
          {{- if .Values.alerts.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "inference-orchestrator.fullname" . }}-alerts
          {{- else }}
          emptyDir: {}
          {{- end }}
