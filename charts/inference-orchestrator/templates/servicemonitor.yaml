{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "inference-orchestrator.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "inference-orchestrator.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.release | quote }}
spec:
  selector:
    matchLabels:
      {{- include "inference-orchestrator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
{{- end }}
