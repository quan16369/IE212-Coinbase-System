apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-validation.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "data-validation.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-validation.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-validation.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "data-validation.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VALIDATED_TARGET
              value: {{ .Values.routing.validatedTarget | quote }}
            - name: QUALITY_TARGET
              value: {{ .Values.routing.qualityTarget | quote }}
            - name: VALIDATION_IDEMPOTENCY_CACHE_SIZE
              value: {{ .Values.idempotency.cacheSize | quote }}
            - name: VALIDATION_IDEMPOTENCY_REDIS_URL
              value: {{ .Values.idempotency.redisUrl | quote }}
            - name: VALIDATION_IDEMPOTENCY_TTL_SECONDS
              value: {{ .Values.idempotency.ttlSeconds | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.kafkaWorker.enabled }}
        - name: kafka-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "services.data_validation.kafka_worker"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafkaWorker.bootstrapServers | quote }}
            - name: KAFKA_INPUT_TOPIC
              value: {{ .Values.kafkaWorker.inputTopic | quote }}
            - name: KAFKA_VALIDATED_TOPIC
              value: {{ .Values.routing.validatedTarget | quote }}
            - name: KAFKA_QUALITY_TOPIC
              value: {{ .Values.routing.qualityTarget | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.kafkaWorker.consumerGroup | quote }}
            - name: VALIDATION_IDEMPOTENCY_REDIS_URL
              value: {{ .Values.idempotency.redisUrl | quote }}
            - name: VALIDATION_IDEMPOTENCY_TTL_SECONDS
              value: {{ .Values.idempotency.ttlSeconds | quote }}
          resources:
            {{- toYaml .Values.kafkaWorker.resources | nindent 12 }}
        {{- end }}
