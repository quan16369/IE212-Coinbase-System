# ModelPack Manifest for Crypto LSTM Model
# Following CNCF ModelPack specification
# https://github.com/modelpack/model-spec

apiVersion: modelpack.io/v1alpha1
kind: Model
metadata:
  name: crypto-lstm-btc
  version: "1.0.0"
  description: "Simple LSTM model for Bitcoin price prediction with Paimon data lakehouse"
  authors:
    - name: "Crypto Pipeline Team"
      email: "team@crypto-pipeline.io"
  license: "Apache-2.0"
  created: "2025-12-31T00:00:00Z"
  labels:
    framework: pytorch
    task: time-series-forecasting
    domain: cryptocurrency
    production: "true"
    
spec:
  # Framework information
  framework:
    name: pytorch
    version: "2.0.0"
  
  # Model format
  format: pytorch
  architecture: lstm-attention
  
  # Model files
  model:
    path: checkpoints/best_epoch_16.pt
    size: 10485760  # 10MB
    hash: 
      algorithm: sha256
      value: ""  # Will be calculated during build
  
  # Configuration
  config:
    path: configs/lstm_paimon_config.yaml
    parameters:
      d_model: 128
      n_layers: 2
      n_heads: 4
      dropout: 0.2
      seq_len: 288
      pred_len: 12
      enc_in: 6
  
  # Training information
  training:
    dataset:
      name: BTC-USD-historical
      source: paimon
      location: s3a://ie212-coinbase-data/paimon/crypto_db/ml_features
      size: "1.2GB"
      timerange:
        start: "2024-01-01"
        end: "2025-12-31"
    
    hyperparameters:
      epochs: 50
      batch_size: 64
      learning_rate: 0.001
      optimizer: adam
      loss_function: mse
    
    metrics:
      - name: mae
        value: 0.025
        description: "Mean Absolute Error"
      - name: rmse
        value: 0.035
        description: "Root Mean Squared Error"
      - name: mape
        value: 0.028
        description: "Mean Absolute Percentage Error"
      - name: direction_accuracy
        value: 0.65
        description: "Prediction direction accuracy"
    
    resources:
      training_time: "10 minutes"
      compute: "CPU (2 cores)"
      memory: "2GB"
  
  # Inference information
  inference:
    runtime: pytorch
    input:
      shape: [batch_size, 288, 6]
      dtype: float32
      description: "24 hours of 5-minute OHLCV data with indicators"
      features:
        - close_price
        - volume
        - rsi_14
        - macd
        - bb_middle
        - volume_sma
    
    output:
      shape: [batch_size, 12, 1]
      dtype: float32
      description: "Next 1 hour price predictions (12 x 5-minute intervals)"
    
    performance:
      latency_p50: "5ms"
      latency_p95: "10ms"
      latency_p99: "15ms"
      throughput: "100 predictions/sec"
      memory: "500MB"
  
  # Dependencies
  dependencies:
    python: "3.9+"
    packages:
      - torch==2.0.0
      - pyspark==3.3.2
      - pyyaml==6.0
      - numpy==1.24.3
      - pandas==2.0.2
  
  # Data lakehouse integration
  datalake:
    type: paimon
    warehouse: s3a://ie212-coinbase-data/paimon
    tables:
      - crypto_db.ml_features
      - crypto_db.raw_prices
      - crypto_db.predictions
  
  # MLOps integration
  mlops:
    tracking:
      platform: mlflow
      experiment: crypto-lstm-simple
      run_id: ""
    
    serving:
      platform: seldon-core
      replicas: 3
      autoscaling:
        enabled: true
        min: 2
        max: 10
        target_cpu: 70
    
    monitoring:
      prometheus:
        enabled: true
        metrics:
          - prediction_latency
          - prediction_error
          - model_drift
      
      grafana:
        dashboard: crypto-prediction
  
  # Compatibility
  compatibility:
    kubernetes: "1.24+"
    oci: "1.0.0"
    platforms:
      - linux/amd64
      - linux/arm64

# Additional metadata
annotations:
  modelpack.io/description: "Production-ready LSTM model for cryptocurrency price prediction"
  modelpack.io/use-case: "Real-time Bitcoin price forecasting with 1-hour horizon"
  modelpack.io/deployment: "Kubernetes with Seldon Core"
  modelpack.io/data-source: "Apache Paimon lakehouse"
  modelpack.io/training-duration: "10 minutes"
  modelpack.io/accuracy: "MAE 0.025 (2.5% error)"
  modelpack.io/simplicity: "Simple LSTM - production ready"
