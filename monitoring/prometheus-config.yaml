apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: crypto-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'crypto-pipeline-cluster'
        environment: 'production'

    # Alertmanager configuration
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093

    # Load rules once and periodically evaluate them
    rule_files:
    - "/etc/prometheus/rules/*.yml"

    scrape_configs:
    # Kubernetes API server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

    # Kubernetes nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

    # Kubernetes pods
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - crypto-pipeline
          - crypto-mlops
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

    # Kafka metrics
    - job_name: 'kafka'
      static_configs:
      - targets:
        - kafka-0.kafka-headless.crypto-pipeline.svc.cluster.local:9092
        - kafka-1.kafka-headless.crypto-pipeline.svc.cluster.local:9092
        - kafka-2.kafka-headless.crypto-pipeline.svc.cluster.local:9092

    # Cassandra metrics
    - job_name: 'cassandra'
      static_configs:
      - targets:
        - cassandra-0.cassandra.crypto-pipeline.svc.cluster.local:9042
        - cassandra-1.cassandra.crypto-pipeline.svc.cluster.local:9042
        - cassandra-2.cassandra.crypto-pipeline.svc.cluster.local:9042

    # Spark metrics
    - job_name: 'spark'
      kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
          - crypto-pipeline
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: spark-processor

    # MLflow metrics
    - job_name: 'mlflow'
      kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
          - crypto-mlops
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: mlflow

    # Seldon Core metrics
    - job_name: 'seldon'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - crypto-pipeline
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_seldon_app]
        action: keep
        regex: crypto-model-serving
