x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  # Kafka configuration
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # Listeners configuration
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # Cluster configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      
      # Data directory
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      
      # Cluster mode
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ie212_pipeline
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Kafka setup: automatic creation topic coin-data
  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Kafka to start...'
        sleep 5
        echo 'Creating topic coin-data...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic coin-data --partitions 3 --replication-factor 1
        echo 'Topic coin-data has been created.'
      "
    networks:
      - ie212_pipeline
    logging: *default-logging

  # Kafka management UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ie212_pipeline
    logging: *default-logging

  # Cassandra setup database
  cassandra:
    build:
      context: ./cassandra
      dockerfile: ./cassandra.Dockerfile
    container_name: cassandra
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME:-coinbase_cluster}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-coinbase}
      - MAX_HEAP_SIZE=${CASSANDRA_MAX_HEAP_SIZE:-512M}
      - HEAP_NEWSIZE=${CASSANDRA_HEAP_NEWSIZE:-100M}
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - ie212_pipeline
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cassandra-migrate:
    image: cassandra:latest
    container_name: cassandra-migrate
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./ops/cassandra/migrations:/migrations:ro
    command: >
      bash -c "
        until cqlsh cassandra 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1; do
          echo 'Waiting for Cassandra migrations target...';
          sleep 5;
        done;
        find /migrations -maxdepth 1 -name '*.cql' -print | sort | xargs -r -I{} cqlsh cassandra 9042 -f {};
      "
    networks:
      - ie212_pipeline
    logging: *default-logging

  # S3 compatible storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - ie212_pipeline
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO setup
  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ie212-coinbase-data}
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        /usr/bin/mc alias set minio http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}";
        /usr/bin/mc mb --ignore-existing minio/"${S3_BUCKET:-ie212-coinbase-data}";
        exit 0;
      "
    networks:
      - ie212_pipeline
    logging: *default-logging

  # Python Producer
  coinbase-producer:
    build:
      context: .
      dockerfile: ./coinbase_kafka_producer/producer.Dockerfile
    container_name: coinbase-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  # Go Consumer
  coinbase-consumer:
    build:
      context: .
      dockerfile: ./go_kafka_consumer/consumer.Dockerfile
    container_name: coinbase-consumer
    depends_on:
      kafka:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_FORCE_PATH_STYLE: "${AWS_S3_FORCE_PATH_STYLE:-true}"
      S3_BUCKET: ${S3_BUCKET:-ie212-coinbase-data}
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  # Spark Processor
  spark-processor:
    build:
      context: .
      dockerfile: ./kafka_spark_processor/processor.Dockerfile
    container_name: spark-processor
    depends_on:
      kafka:
        condition: service_started
      cassandra-migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging
    
  # MLflow tracking for CPU ML experiments and model comparison
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    profiles:
      - mlops
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:5000"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  # BentoML service for CPU-friendly LightGBM price prediction
  bento-price-predictor:
    build:
      context: .
      dockerfile: ./mlops/bento.Dockerfile
    container_name: bento-price-predictor
    profiles:
      - mlops
    environment:
      - MLOPS_MODEL_PATH=/models/coinbase_ml_model.joblib
      - MLOPS_MODEL_URI=${MLOPS_MODEL_URI:-}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - BENTOML_MODEL_TAG=${BENTOML_MODEL_TAG:-coinbase_price_lightgbm:latest}
      - MLOPS_HORIZON=${MLOPS_HORIZON:-4}
      - MLOPS_FREQ_MINUTES=${MLOPS_FREQ_MINUTES:-60}
    ports:
      - "${BENTO_SERVICE_PORT:-3001}:3000"
    depends_on:
      - mlflow
    networks:
      - ie212_pipeline
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # Local Jenkins controller for CI/CD experiments. Start with COMPOSE_PROFILES=ci.
  jenkins:
    build:
      context: .
      dockerfile: ./ops/jenkins/jenkins.Dockerfile
    container_name: jenkins
    profiles:
      - ci
    user: root
    ports:
      - "${JENKINS_PORT:-8088}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      - JAVA_OPTS=${JENKINS_JAVA_OPTS:--Djenkins.install.runSetupWizard=true}
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace/Coinbase_Streaming
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  # Local SonarQube for optional code quality scans. Start with COMPOSE_PROFILES=ci.
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    profiles:
      - ci
    ports:
      - "${SONARQUBE_PORT:-9002}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  # Grafana for visualization
  grafana:
    build:
      context: ./grafana
      dockerfile: ./grafana.Dockerfile
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/config:/etc/grafana/config
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_LOG_LEVEL=${GRAFANA_LOG_LEVEL:-info}
    networks:
      - ie212_pipeline
    depends_on:
      - cassandra
    restart: unless-stopped
    logging: *default-logging

  # Metrics and alerting. Start with: COMPOSE_PROFILES=ops docker compose up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - ops
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ie212_pipeline
    depends_on:
      - alertmanager
      - blackbox-exporter
      - cadvisor
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    profiles:
      - ops
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    profiles:
      - ops
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    profiles:
      - ops
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:latest
    container_name: loki
    profiles:
      - ops
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - loki-data:/loki
    networks:
      - ie212_pipeline
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    profiles:
      - ops
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ie212_pipeline
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging

volumes:
  kafka-data:
  cassandra-data:
  minio-data:
  grafana-data:
  jenkins-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  mlflow-data:
  prometheus-data:
  alertmanager-data:
  loki-data:

networks:
  ie212_pipeline:
    driver: bridge
